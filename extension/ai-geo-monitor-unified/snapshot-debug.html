<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>AI-GEO Monitor 快照测试</title>
  <style>body{font:14px system-ui,sans-serif;max-width:680px;margin:32px auto;padding:0 16px;color:#202124}dt{font-weight:600;margin-top:12px}dd{margin:4px 0;overflow-wrap:anywhere}button{margin-top:20px;padding:8px 14px}</style>
</head>
<body>
  <h1>快照测试</h1>
  <p id="empty" hidden>暂无快照</p>
  <dl id="details" hidden><dt>平台</dt><dd id="platform"></dd><dt>保存时间</dt><dd id="captured-at"></dd><dt>会话 URL</dt><dd id="conversation-url"></dd><dt>文件大小</dt><dd id="bytes"></dd><dt>Snapshot ID</dt><dd id="snapshot-id"></dd></dl>
  <button id="export" type="button" disabled>导出最新快照</button>
  <p id="save-status" role="status"></p>
  <script src="snapshot-debug.js"></script>
</body>
</html>
